<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>maia-tim</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.base.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.brown.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.cburnett.css">
<style>
  :root { --bg:#161512; --panel:#262421; --text:#bababa; --hi:#e8e6e3; --accent:#629924;
          --low:#c33; --muted:#7a7775; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { display:flex; gap:20px; justify-content:center; align-items:flex-start;
         padding:20px 16px; flex-wrap:wrap; }
  #board { width:min(560px, 92vw); height:min(560px, 92vw); }
  .side { width:290px; display:flex; flex-direction:column; gap:12px; }
  .panel { background:var(--panel); border-radius:6px; padding:12px; }
  .clock { display:flex; justify-content:space-between; align-items:center;
           background:var(--panel); border-radius:6px; padding:8px 12px; }
  .clock .t { font:600 34px/1 ui-monospace, "Consolas", monospace; color:var(--muted); }
  .clock.run .t { color:var(--hi); }
  .clock.low .t { color:var(--low); }
  .clock .who { font-weight:600; }
  label { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:6px 0; }
  select, input[type=number] { background:#1b1a17; color:var(--hi); border:1px solid #3a3835;
         border-radius:4px; padding:4px 6px; width:150px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:4px; padding:9px 12px;
           font-weight:600; cursor:pointer; width:100%; }
  button.secondary { background:#3a3835; }
  button:disabled { opacity:.5; cursor:default; }
  #status { min-height:20px; color:var(--hi); font-weight:600; }
  #moves { max-height:260px; overflow-y:auto; font:13px/1.6 ui-monospace, "Consolas", monospace; }
  #moves .row { display:grid; grid-template-columns:28px 1fr 1fr; }
  #moves .n { color:var(--muted); }
  #moves .think { color:var(--muted); font-size:11px; }
  #moves .mv { border-radius:3px; padding:0 3px; }
  body.reviewing #moves .mv { cursor:pointer; }
  body.reviewing #moves .mv:hover { background:#3a3835; }
  #moves .mv.cur { background:var(--accent); color:#fff; }
  #moves .mv.cur .think { color:#e8e6e3; }
  .info { color:var(--muted); font-size:12px; }
  #wdl-bar { display:flex; height:10px; border-radius:5px; overflow:hidden; background:#1b1a17; margin:6px 0 4px; }
  #wdl-bar span { display:block; height:100%; transition:width .3s; }
  #wdl-bar .a { background:var(--hi); }
  #wdl-bar .d { background:var(--muted); }
  #wdl-bar .b { background:var(--accent); }
  #wdl-text { display:flex; justify-content:space-between; font-size:12px; }
  #wdl-head { color:var(--hi); font-weight:600; }
  h1 { font-size:15px; margin:0 0 4px; color:var(--hi); }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <div>
    <div class="clock" id="clock-top"><span class="who" id="name-top">maia-tim</span><span class="t">0:30</span></div>
    <div id="board" style="margin:8px 0"></div>
    <div class="clock" id="clock-bottom"><span class="who" id="name-bottom">You</span><span class="t">0:30</span></div>
  </div>
  <div class="side">
    <div class="panel">
      <h1>maia-tim</h1>
      <div class="info" id="engine-info">loading…</div>
    </div>
    <div class="panel">
      <label>Mode
        <select id="mode"><option value="play">Play vs maia-tim</option><option value="watch">Watch it play itself</option></select></label>
      <label>Time control
        <select id="tc"><option value="30">30+0</option><option value="60">1+0</option></select></label>
      <label class="play-only">You play
        <select id="color"><option value="random">random</option><option value="white">white</option><option value="black">black</option></select></label>
      <label title="Which era of the player to imitate: the rating at the time. Only bands the model trained on are offered."><span id="era1-label">Bot era (rating)</span>
        <select id="rating"></select></label>
      <label class="watch-only hidden" title="Era for the black side, so two eras can play each other.">Black era
        <select id="rating2"></select></label>
      <label class="play-only" title="Your rating, as the bot sees its opponent: it plays differently against stronger and weaker opponents.">Your rating
        <input type="number" id="opp" min="900" max="3200" step="10" value="2300"></label>
      <label title="100 = sample choices as learned; 0 = always the single most likely move.">Temperature
        <input type="number" id="temp" min="0" max="300" step="10" value="100"></label>
      <label title="Wait the sampled think time (incl. premove-speed answers). Off = answer instantly.">Imitate think time
        <input type="checkbox" id="mimic" checked></label>
      <button id="start">Start game</button>
      <button id="resign" class="secondary" disabled style="margin-top:8px">Resign</button>
    </div>
    <div class="panel"><div id="status"></div>
      <button id="pgn" class="secondary hidden" style="margin-top:8px">Download last game (PGN)</button></div>
    <div class="panel hidden" id="wdl" title="The model's own estimate, from the position, both clocks and both ratings, of how this game ends. Updated each time the bot moves.">
      <div id="wdl-head"></div>
      <div id="wdl-bar"><span class="a"></span><span class="d"></span><span class="b"></span></div>
      <div id="wdl-text"><span id="wdl-a"></span><span id="wdl-d"></span><span id="wdl-b"></span></div>
    </div>
    <div class="panel"><div id="moves"></div></div>
  </div>
</main>

<script type="module">
import { Chessground } from 'https://cdn.jsdelivr.net/npm/chessground@9.1.1/+esm';
import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.0.0/+esm';

const $ = (id) => document.getElementById(id);
let chess, human = null, bots = new Set(), orientation = 'white', eras = {};
let clocks, firstMoved, over = true, lastTick = 0, plyClock = [], plyThink = [];
let tc = 30, info = {}, gameId = 0, lastPgn = null, paused = false;

const cg = Chessground($('board'), {
  movable: { free: false, color: undefined, showDests: true,
             events: { after: (orig, dest) => humanMoved(orig, dest) } },
  premovable: { enabled: true, showDests: true },
  draggable: { showGhost: true },
  animation: { duration: 80 },
  highlight: { lastMove: true, check: true },
});

// The engine lives either behind the local Python server, or -- in the
// static (GitHub Pages) build, which sets window.MAIA_STATIC -- in this page,
// running the model with onnxruntime-web. Same interface either way.
const post = (path, obj) => fetch(path, { method: 'POST', body: JSON.stringify(obj) }).then(r => r.json());
const serverBackend = {
  info: () => fetch('/api/info').then(r => r.json()),
  newGame: (payload) => post('/api/new', payload),
  move: (body) => post('/api/move', body),
  save: (pgn) => post('/api/save', { pgn }),
};
$('start').disabled = true;
const backend = window.MAIA_STATIC
  ? await (await import('./engine.js')).createBackend((msg) => { $('engine-info').textContent = msg; })
  : serverBackend;
$('start').disabled = false;

backend.info().then(i => {
  info = i;
  $('engine-info').textContent = `${i.version}` + (i.epoch != null ? ` · epoch ${i.epoch}` : '') +
    (i.move_match_recent != null ? ` · ${i.move_match_recent}% move-match` : '') + ` · ${i.device}`;
  fillEras($('rating'), i.rating_buckets, i.bucket || 50, i.default_rating);
  fillEras($('rating2'), i.rating_buckets, i.bucket || 50, 2250);  // current-ish era vs peak
});

// Era dropdown: one option per 50-point rating band the model actually
// trained on (with how many moves back it, when known). The model is given
// the middle of the band.
function fillEras(sel, buckets, step, preferred) {
  const kfmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : n;
  if (!buckets || !buckets.length) {           // training data not on this machine
    buckets = [];
    for (let r = 1500; r <= 2450; r += step) buckets.push({ rating: r });
  }
  sel.innerHTML = buckets.slice().reverse().map(b =>
    `<option value="${b.rating + step / 2}">${b.rating}–${b.rating + step - 1}` +
    (b.moves ? ` · ${kfmt(b.moves)}` : '') + '</option>').join('');
  const want = buckets.find(b => preferred >= b.rating && preferred < b.rating + step);
  sel.value = String((want || buckets[buckets.length - 1]).rating + step / 2);
}
const eraLabel = (sel) => sel.selectedOptions[0]?.textContent.split(' ·')[0] ?? sel.value;

$('mode').onchange = () => {
  const watch = $('mode').value === 'watch';
  document.querySelectorAll('.play-only').forEach(e => e.classList.toggle('hidden', watch));
  document.querySelectorAll('.watch-only').forEach(e => e.classList.toggle('hidden', !watch));
  $('era1-label').textContent = watch ? 'White era' : 'Bot era (rating)';
  $('resign').textContent = watch ? 'Stop' : 'Resign';
};

const s = (c) => c[0];                          // 'white' -> 'w'
const col = (x) => (x === 'w' ? 'white' : 'black');
const name = (x) => human && s(human) === x ? 'You' : `maia-tim (${eras[x]})`;

function dests() {
  const m = new Map();
  for (const mv of chess.moves({ verbose: true })) {
    if (!m.has(mv.from)) m.set(mv.from, []);
    m.get(mv.from).push(mv.to);
  }
  return m;
}

function sync(lastMove) {
  const movable = !over && human;
  cg.set({
    fen: chess.fen(), turnColor: col(chess.turn()), lastMove,
    check: chess.inCheck() ? col(chess.turn()) : false,
    movable: { color: movable ? human : undefined, dests: movable ? dests() : new Map() },
  });
}

function fmt(ms) {
  const t = Math.max(ms, 0) / 1000;
  if (t < 10) return t.toFixed(1);
  return `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
}

function renderClocks() {
  const bottom = s(orientation), top = bottom === 'w' ? 'b' : 'w';
  for (const [el, x] of [['clock-top', top], ['clock-bottom', bottom]]) {
    const node = $(el);
    node.querySelector('.t').textContent = fmt(clocks[x]);
    node.classList.toggle('run', !over && chess.turn() === x && firstMoved[x]);
    node.classList.toggle('low', clocks[x] < 5000);
  }
}

// Lichess rule the model was trained on: each side's first move is untimed.
// Driven by a timer, not requestAnimationFrame: browsers pause animation frames
// in hidden tabs, which would freeze the clocks and miss flag-falls.
let clockTimer = null;
function tick() {
  if (over) return;
  if (paused) { lastTick = performance.now(); return; }   // the repaint wait is off the clock
  const now = performance.now(), x = chess.turn();
  if (firstMoved[x]) clocks[x] -= now - lastTick;
  lastTick = now;
  if (clocks[x] <= 0) {
    clocks[x] = 0;
    finish(x === 'w' ? '0-1' : '1-0', `${name(x)} flagged`);
  }
  renderClocks();
}

function moveMade(x) {           // x just moved: settle its clock exactly
  const now = performance.now();
  if (firstMoved[x]) clocks[x] -= now - lastTick;
  lastTick = now;
  firstMoved[x] = true;
  plyClock.push(Math.max(clocks[x], 0));
}

function renderMoves() {
  const h = chess.history();
  let html = '';
  for (let i = 0; i < h.length; i += 2) {
    const cell = (j) => h[j] === undefined ? '<span></span>' :
      `<span class="mv" data-ply="${j + 1}">${h[j]}${plyThink[j] != null ? ` <span class="think">${plyThink[j].toFixed(2)}s</span>` : ''}</span>`;
    html += `<div class="row"><span class="n">${i / 2 + 1}.</span>${cell(i)}${cell(i + 1)}</div>`;
  }
  $('moves').innerHTML = html;
  $('moves').scrollTop = $('moves').scrollHeight;
}

// --- reviewing a finished game ---------------------------------------------
// Click a move, or ← / → to step, ↑ to jump to the end, ↓ to the start. Only
// once the game is over: during play the board always shows the live position.
let viewPly = null;   // plies shown on the board; null = the live position

function showPly(k) {
  const hist = chess.history({ verbose: true });
  k = Math.max(0, Math.min(hist.length, k));
  const pos = new Chess();
  for (let i = 0; i < k; i++) pos.move(hist[i].san);
  viewPly = k;
  cg.set({
    fen: pos.fen(), turnColor: col(pos.turn()),
    lastMove: k ? [hist[k - 1].from, hist[k - 1].to] : undefined,
    check: pos.inCheck() ? col(pos.turn()) : false,
    movable: { color: undefined, dests: new Map() },
  });
  document.querySelectorAll('#moves .mv').forEach((el) =>
    el.classList.toggle('cur', Number(el.dataset.ply) === k));
  const cur = document.querySelector('#moves .mv.cur');
  if (cur) cur.scrollIntoView({ block: 'nearest' });
}

$('moves').addEventListener('click', (ev) => {
  const el = ev.target.closest('.mv');
  if (el && over && chess) showPly(Number(el.dataset.ply));
});

document.addEventListener('keydown', (ev) => {
  if (!over || !chess || !chess.history().length) return;
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
  const end = chess.history().length, at = viewPly ?? end;
  const to = { ArrowLeft: at - 1, ArrowRight: at + 1, ArrowUp: end, ArrowDown: 0 }[ev.key];
  if (to === undefined) return;
  ev.preventDefault();
  showPly(to);
});

function checkEnd() {
  if (!chess.isGameOver()) return false;
  if (chess.isCheckmate()) {
    const loser = chess.turn(), winner = loser === 'w' ? 'b' : 'w';
    finish(loser === 'w' ? '0-1' : '1-0', `checkmate — ${name(winner)} won`);
  } else {
    const why = chess.isStalemate() ? 'stalemate' : chess.isThreefoldRepetition() ? 'threefold repetition'
      : chess.isInsufficientMaterial() ? 'insufficient material' : 'draw';
    finish('1/2-1/2', why);
  }
  return true;
}

// After any move: hand the turn to whoever is to move next.
function next() {
  if (checkEnd()) return;
  const x = chess.turn();
  if (bots.has(x)) botTurn(x);
  else { $('status').textContent = ''; cg.playPremove(); }   // a queued premove fires humanMoved
}

function humanMoved(orig, dest) {
  if (over || !human || chess.turn() !== s(human)) return;
  try { chess.move({ from: orig, to: dest, promotion: 'q' }); }   // auto-queen
  catch { sync(); return; }
  moveMade(s(human));
  plyThink.push(null);
  sync([orig, dest]);
  renderMoves();
  next();
}

async function botTurn(x) {
  const id = gameId;
  $('status').textContent = `${name(x)} is thinking…`;
  // Let the browser draw the last move before thinking: the in-browser engine
  // runs on this thread, so back-to-back instant answers would otherwise only
  // ever paint the final position. Waits for one painted frame (or 50 ms, so a
  // hidden tab, which paints no frames, keeps playing); not charged to a clock.
  paused = true;
  await new Promise((r) => {
    const t = setTimeout(r, 50);
    requestAnimationFrame(() => requestAnimationFrame(() => { clearTimeout(t); r(); }));
  });
  paused = false;
  lastTick = performance.now();
  if (over || id !== gameId) return;
  const sent = performance.now();
  const moves = chess.history({ verbose: true }).map(m => m.lan);
  let reply;
  try {
    reply = await backend.move({ side: x, moves,
      wtime: Math.round(Math.max(clocks.w, 0)), btime: Math.round(Math.max(clocks.b, 0)) });
  } catch (e) { $('status').textContent = 'engine error: ' + e; return; }
  if (over || id !== gameId) return;           // flagged/stopped while thinking
  if (reply.wdl) showWdl(x, reply.wdl);
  const u = reply.move;
  chess.move({ from: u.slice(0, 2), to: u.slice(2, 4), promotion: u[4] || 'q' });
  moveMade(x);
  plyThink.push((performance.now() - sent) / 1000);
  sync([u.slice(0, 2), u.slice(2, 4)]);
  renderMoves();
  $('status').textContent = '';
  next();
}

// The bot's result estimate ([loss, draw, win] for the side that just moved).
// Playing: the bot's chances against you. Watching: White's vs Black's.
function showWdl(x, [loss, draw, win]) {
  let a = win, b = loss, la = 'maia-tim', lb = 'you';
  if (!human) {
    [a, b] = x === 'w' ? [win, loss] : [loss, win];
    [la, lb] = [`White (${eras.w})`, `Black (${eras.b})`];
  }
  const pct = (v) => `${Math.round(v * 100)}%`;
  $('wdl').classList.remove('hidden');
  $('wdl-head').textContent = human ? `Bot confidence: ${pct(win)} to win` : 'Predicted result';
  const bar = $('wdl-bar').children;
  bar[0].style.width = pct(a); bar[1].style.width = pct(draw); bar[2].style.width = pct(b);
  $('wdl-a').textContent = `${la} ${pct(a)}`;
  $('wdl-d').textContent = `draw ${pct(draw)}`;
  $('wdl-b').textContent = `${lb} ${pct(b)}`;
}

function clk(ms) {
  const t = ms / 1000, h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60);
  return `${h}:${String(m).padStart(2, '0')}:${(t % 60).toFixed(1).padStart(4, '0')}`;
}

async function finish(result, reason) {
  if (over) return;
  over = true;
  viewPly = null;
  document.body.classList.add('reviewing');   // moves become clickable
  clearInterval(clockTimer);
  cg.cancelPremove();
  sync();
  renderClocks();
  $('status').textContent = `${result} · ${reason}`;
  $('start').disabled = false;
  $('resign').disabled = true;
  const h = chess.history();
  if (!h.length) return;                       // nothing worth saving
  const pname = (x) => human && s(human) === x ? 'You' : `maia-tim ${info.version} (${eras[x]})`;
  const tags = {
    Event: human ? 'maia-tim local' : 'maia-tim self-play',
    Date: new Date().toISOString().slice(0, 10).replaceAll('-', '.'),
    White: pname('w'), Black: pname('b'), Result: result, TimeControl: `${tc}+0`,
    Termination: reason, BotTemperature: $('temp').value,
    BotMimicTime: String($('mimic').checked), BotModel: `maia-tim ${info.version}` + (info.epoch != null ? ` epoch ${info.epoch}` : ''),
  };
  let pgn = Object.entries(tags).map(([k, v]) => `[${k} "${v}"]`).join('\n') + '\n\n';
  h.forEach((san, i) => {
    if (i % 2 === 0) pgn += `${i / 2 + 1}. `;
    pgn += `${san} { [%clk ${clk(plyClock[i])}] } `;
  });
  pgn += result + '\n';
  // The last finished game is always one click away; nothing downloads by itself.
  lastPgn = pgn;
  $('pgn').classList.remove('hidden');
  try {
    const saved = (await backend.save(pgn)).saved;   // the local server also keeps every game
    if (saved) $('status').textContent += ` · saved ${saved}`;
  } catch {}
}

$('pgn').onclick = () => {
  if (!lastPgn) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lastPgn], { type: 'application/x-chess-pgn' }));
  a.download = `maia-tim-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.pgn`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

$('start').onclick = async () => {
  gameId++;
  tc = Number($('tc').value);
  const watch = $('mode').value === 'watch';
  const cfg = (sel) => ({ rating: Number(sel.value), temperature: Number($('temp').value),
                          mimic: $('mimic').checked });
  let payload;
  if (watch) {
    human = null;
    bots = new Set(['w', 'b']);
    eras = { w: eraLabel($('rating')), b: eraLabel($('rating2')) };
    payload = { w: cfg($('rating')), b: cfg($('rating2')) };
    orientation = 'white';
  } else {
    const pick = $('color').value;
    human = pick === 'random' ? (Math.random() < 0.5 ? 'white' : 'black') : pick;
    const bot = human === 'white' ? 'b' : 'w';
    bots = new Set([bot]);
    eras = { [bot]: eraLabel($('rating')) };
    payload = { w: null, b: null, [bot]: cfg($('rating')), human_rating: Number($('opp').value) };
    orientation = human;
  }
  await backend.newGame(payload);
  chess = new Chess();
  clocks = { w: tc * 1000, b: tc * 1000 };
  firstMoved = { w: false, b: false };
  plyClock = []; plyThink = [];
  $('wdl').classList.add('hidden');
  viewPly = null;
  paused = false;
  document.body.classList.remove('reviewing');
  over = false;
  const bottom = s(orientation), top = bottom === 'w' ? 'b' : 'w';
  $('name-top').textContent = name(top);
  $('name-bottom').textContent = name(bottom);
  cg.set({ orientation });
  sync();
  renderMoves();
  $('start').disabled = true;
  $('resign').disabled = false;
  lastTick = performance.now();
  clearInterval(clockTimer);
  clockTimer = setInterval(tick, 50);
  next();
};

$('resign').onclick = () => {
  if (human) finish(human === 'white' ? '0-1' : '1-0', 'you resigned');
  else finish('*', 'stopped');
};
</script>
</body>
</html>
